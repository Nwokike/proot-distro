[project]
name = "m0-spike"
version = "0.1.0"
description = "Throwaway M0 device-spike harness: proves proot mechanics on Android (go/no-go). See docs/roadmap.md."
requires-python = ">=3.14"
dependencies = [
    "flet==1.0.4",
    "flet-terminal==0.3.9",
    "proot-distro==5.10.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "flet-cli==1.0.4",
    "flet-desktop==1.0.4",
]

# ── M0 spike build config. `flet-proot` (the native payload wheel) is NOT a
# ── [project] dependency: it is resolved only during `flet build` from the
# ── CI-provided PIP_FIND_LINKS directory containing the wheel produced by
# ── tools/build_proot_wheel.py. Local uv sync therefore stays clean.
[tool.flet]
org = "ng.kiri"
product = "M0 Spike"
company = "Kiri Research Labs"
build_number = 1

[tool.flet.app]
path = "src"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
startup_message = "M0 spike: proving proot on Android..."

[tool.flet.android]
bundle_id = "ng.kiri.m0spike"
split_per_abi = true
# Required so APK native libs extract to nativeLibraryDir on install —
# the only SELinux-allowed execve path for bundled binaries (see docs/reference/dep-flet-cli.md).
legacy_packaging = true
target_arch = ["arm64-v8a"]
dependencies = ["flet-proot"]

# House signing convention: the CI decodes KEYSTORE_BASE64 -> kiri_keystore.jks
# and overrides this via FLET_ANDROID_SIGNING_* env (see workflow).
[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]
# BLE001 (blind except) is deliberate here: every gate must capture and
# surface *any* failure into the on-device log instead of crashing the app.
ignore = ["E501", "BLE001"]


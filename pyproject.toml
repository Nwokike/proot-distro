[project]
# The uv project name must differ from the wrapped dependency "proot-distro"
# (uv rejects self-dependencies); the repo itself is Nwokike/proot-distro.
name = "proot-distro-flet"
version = "1.1.0"
description = "Run Debian, Ubuntu, Alpine and any Docker image on your phone — terminal and X11 desktop, no root, no Termux. Built with Flet."
readme = "README.md"
requires-python = ">=3.14"
# The Flet family is pinned as ONE coordinated set: the extensions demand an
# exact flet version, and a range here can resolve flet dev5 against an
# extension built for dev4 — a build-time conflict.
dependencies = [
    "flet==1.1.0",
    "flet-ads==1.1.0",
    "flet-notifications==1.1.0",
    "flet-webview==1.1.0",
    "httpx>=0.28.1",
    "flet-terminal==0.4.2",
    "proot-distro>=5.10.0",
    "termux-desk",
    ]

[tool.uv]
package = false

[tool.uv.sources]
termux-desk = { git = "https://github.com/amirghm/termux-desk.git", rev = "446fadf91d392ef4480fefd61e4a5b39c5567b9a" }

[tool.flet]
org = "ng.kiri"
product = "Proot Distro X11"
company = "Kiri Research Labs"
build_number = 3
icon = "src/assets/icon.png"

[tool.flet.app]
path = "src"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
startup_message = "Starting Proot Distro X11…"

[tool.flet.splash]
color = "#121218"
dark_color = "#121218"

[tool.flet.android]
bundle_id = "ng.kiri.prootdistro"
split_per_abi = true
legacy_packaging = true
target_arch = ["arm64-v8a", "x86_64"]
dependencies = ["flet-proot==5.1.107.102"]
# Our own Android resources (notification small icon drawable), copied into
# the generated android/app/src/main/res by flet build.
res_dir = "android_res"

# The desktop WebView loads TermuxDesk's viewer over http://127.0.0.1 inside
# the proot container (guest loopback == host loopback); Android 9+ blocks
# cleartext HTTP by default, so allow it here. Written verbatim onto the
# <application> element of the merged manifest.
[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.flet.cleanup]
package_files = ["oauthlib/**"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService"]
exported = false
foregroundServiceType = "specialUse"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~7325028963"
"android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" = "Linux container and X11 desktop sessions stay alive in the background"

[dependency-groups]
dev = [
    "flet-cli>=1.1.0",
    "flet-desktop>=1.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-ra", "-q"]
timeout = 60
strict_markers = true
strict_config = true
markers = [
    "live: hits the real device or network (deselected on desktop CI)",
]
filterwarnings = [
    "error::Warning:^(services|screens|components|core|state|hooks|tests)(\\.|$)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "Q", "C4", "PERF", "ERA", "I", "T20", "DTZ", "RUF", "S", "TRY", "BLE", "EM", "A", "SIM", "RET", "RSE"]
ignore = ["E501", "EM101", "EM102", "EM103", "TRY003", "BLE001", "S110", "SIM105", "TRY300", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/check_flet_api.py" = ["T201"]
"tests/test_desk_service.py" = ["S104", "S108"]  # asserts wrap-surface strings, never binds
"tests/test_flet_api_guard.py" = ["S603"]
"scripts/build_flet_proot_wheel.py" = ["T201", "S310"]
"scripts/check_elf_alignment.py" = ["T201"]
"scripts/generate_third_party_sources.py" = ["T201", "E402"]

[project]
name = "proot-distro-x11"
version = "1.2.1"
description = "Run Debian, Ubuntu, Alpine and any Docker image on your phone; terminal and X11 desktop, no root, no Termux. Built with Flet."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet==1.1.2",
    "flet-ads==1.1.2",
    "flet-notifications==1.1.2",
    "flet-webview==1.1.2",
    "httpx>=0.28.1",
    "flet-terminal>=0.4.2",
    "proot-distro>=5.10.3",
    "aiohttp>=3.14",
    "flet-audio-recorder==1.1.2",
]

[tool.uv]
package = false

[tool.flet]
org = "ng.kiri"
product = "Proot Distro X11"
company = "Kiri Research Labs"
build_number = 5
icon = "src/assets/icon.png"

[tool.flet.app]
path = "src"

[tool.flet.boot_screen]
name = "flet"

[tool.flet.android]
bundle_id = "ng.kiri.prootdistro"
split_per_abi = true
legacy_packaging = true
target_arch = ["arm64-v8a", "x86_64"]
dependencies = [
    "flet-proot==5.1.107.102",
    # The display payloads (Xvnc + PulseAudio, Termux repackages) — jniLibs only,
    # never imported on desktop; the runtime guards the manifest imports.
    "flet-xvnc==1.16.2",
    "flet-pulseaudio==17.0",
    # QEMU user-mode emulators (all four non-host arches): foreign-architecture
    # containers run through `proot -q qemu-<arch>`, located by name on PATH.
    "flet-qemu==11.1.3",
]
# Our own Android resources (notification small icon drawable), copied into
# the generated android/app/src/main/res by flet build.
res_dir = "android_res"

# The vendored upstream noVNC viewer loads over http://127.0.0.1 inside
# the proot container (guest loopback == host loopback); Android 9+ blocks
# cleartext HTTP by default, so allow it here. Written verbatim onto the
# <application> element of the merged manifest.
[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.flet.cleanup]
package_files = ["oauthlib/**"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.WAKE_LOCK" = true
# The display's microphone path: PulseAudio's sles-source module records the
# mic and serves it to guest apps over PULSE_SERVER.
"android.permission.RECORD_AUDIO" = true

# uses-feature declarations. Play treats a permission as implying its hardware
# feature: RECORD_AUDIO implies android.hardware.microphone REQUIRED unless the
# feature is explicitly declared not required. That silently filtered every
# mic-less TV (11 devices) plus 7 phone/tablet models out of the 1.2.0 release.
# Flet only declares leanback/touchscreen false on its own; these entries make
# all three explicit so the store keeps the full 1.0.0 device set.
[tool.flet.android.feature]
"android.hardware.microphone" = false
"android.hardware.touchscreen" = false
"android.software.leanback" = false

[tool.flet.android.service."com.dexterous.flutterlocalnotifications.ForegroundService"]
exported = false
foregroundServiceType = "specialUse"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~7325028963"
"android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" = "Linux container and X11 desktop sessions stay alive in the background"

[dependency-groups]
dev = [
    "flet-cli>=1.1.0",
    "flet-desktop>=1.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-ra", "-q"]
timeout = 60
strict_markers = true
strict_config = true
markers = [
    "live: hits the real device or network (deselected on desktop CI)",
]
filterwarnings = [
    "error::Warning:^(services|screens|components|core|state|hooks|tests)(\\.|$)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "Q", "C4", "PERF", "ERA", "I", "T20", "DTZ", "RUF", "S", "TRY", "BLE", "EM", "A", "SIM", "RET", "RSE"]
ignore = ["E501", "EM101", "EM102", "EM103", "TRY003", "BLE001", "S110", "SIM105", "TRY300", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/check_flet_api.py" = ["T201"]
"tests/test_desk_service.py" = ["S104", "S108"]  # asserts wrap-surface strings, never binds
"tests/test_flet_api_guard.py" = ["S603"]
# /etc/passwd fixture + an executable test file named qemu (no real secrets).
"tests/test_settings_and_shell_options.py" = ["S103", "S105"]
"scripts/build_flet_proot_wheel.py" = ["T201", "S310"]
"scripts/build_flet_xvnc_wheel.py" = ["T201", "S310"]
"scripts/build_flet_pulseaudio_wheel.py" = ["T201", "S310"]
"scripts/build_flet_qemu_wheel.py" = ["T201", "S310"]
"scripts/fetch_novnc.py" = ["T201"]
"scripts/check_elf_alignment.py" = ["T201"]
"scripts/generate_third_party_sources.py" = ["T201", "E402"]

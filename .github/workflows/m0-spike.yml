name: M0 Spike

on:
  workflow_dispatch:
  push:
    paths:
      - "m0-spike/**"
      - "tools/**"
      - ".github/workflows/m0-spike.yml"

permissions:
  contents: write

env:
  UV_PYTHON: "3.14"

jobs:
  apk:
    name: Build spike APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m0-spike
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Sync Python deps
        run: uv sync --frozen

      - name: Lint + compile + flet API guard
        run: |
          uvx ruff check src tools
          uv run --frozen python -m py_compile src/main.py tools/*.py
          uv run --frozen python tools/check_flet_api.py src/main.py

      - name: Build native payload wheel (flet-proot)
        run: python3 tools/build_proot_wheel.py --out dist

      # House signing convention (same as Nwokike/Sherlock, DDGS, …):
      # KEYSTORE_BASE64 -> kiri_keystore.jks, alias/passwords via secrets.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks

      - name: flet build apk (split-per-abi, legacy packaging)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/m0-spike/dist
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/m0-spike/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run --frozen flet build apk --split-per-abi --yes -v

      - name: Inspect APK (payload presence + 16K alignment)
        run: python3 tools/check_apk_alignment.py build/apk/*.apk

      # Delivery is the prerelease below, NOT actions/upload-artifact:
      # this account's Actions artifact storage quota is exhausted
      # ("Artifact storage quota has been hit", 2026-10-16) — release assets
      # are unaffected and are the house delivery mechanism anyway.
      - name: Publish spike prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: spike-${{ github.run_number }}
          name: "M0 Spike build #${{ github.run_number }}"
          body: |
            Throwaway M0 device-spike APK — proves proot mechanics on Android (go/no-go).

            Device protocol: `docs/m0-checklist.md` · commit `${{ github.sha }}`
          prerelease: true
          make_latest: false
          files: m0-spike/build/apk/*.apk

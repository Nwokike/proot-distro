name: App Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "1.0.0"
      build_number:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '1.0.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (project + dev group)
        run: uv sync --frozen --group dev
      - name: Ruff
        run: |
          uv run ruff check src tests scripts/build_flet_proot_wheel.py scripts/check_elf_alignment.py scripts/generate_third_party_sources.py
          uv run ruff format --check src tests scripts/build_flet_proot_wheel.py scripts/check_elf_alignment.py scripts/generate_third_party_sources.py
      - name: Flet API guard (AST, installed flet)
        run: |
          for f in $(find src -name "*.py"); do
            uv run --no-sync python tests/check_flet_api.py "$f" || exit 1
          done
      - name: Release identity consistency
        run: |
          uv run --frozen python - <<'PY'
          import json, os, sys, tomllib

          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          felb = str(tomllib.load(open("pyproject.toml", "rb"))["tool"]["flet"]["build_number"])
          sys.path.insert(0, "src")
          from core.constants import APP_BUILD_NUMBER, APP_VERSION

          vj = None
          if os.path.exists("version.json"):
              with open("version.json") as f:
                  vj = json.load(f)
          env_v, env_b = os.environ["BUILD_VERSION"], os.environ["BUILD_NUMBER"]
          errs = []

          if env_v != py:
              errs.append(f"BUILD_VERSION {env_v!r} != pyproject {py!r}")
          if APP_VERSION != py:
              errs.append(f"core.constants.APP_VERSION {APP_VERSION!r} != pyproject {py!r}")
          if str(APP_BUILD_NUMBER) != env_b:
              errs.append(f"APP_BUILD_NUMBER {APP_BUILD_NUMBER} != BUILD_NUMBER {env_b}")
          if felb != env_b:
              errs.append(f"tool.flet.build_number {felb} != BUILD_NUMBER {env_b}")

          # PEP 440 comparison — the old dotted-int vt() flagged "1.0" vs
          # "1.0.0" (the same version) as AHEAD and crashed on pre-release
          # strings like "1.0.0-rc1".
          from packaging.version import InvalidVersion, Version

          def vt(s):
              try:
                  return Version(s)
              except InvalidVersion:
                  errs.append(f"version {s!r} is not PEP 440")
                  return Version("0")

          vj_v = (vj or {}).get("version")
          if vj_v is None:
              print(f"NOTICE: version.json absent — held back entirely while app is {py} (build {env_b})")
          elif vj_v == py:
              if str(vj["build_number"]) != env_b:
                  errs.append(f"version.json synced to {vj_v} but build_number {vj['build_number']} != BUILD_NUMBER {env_b}")
              else:
                  print(f"versions synced: {py} (build {env_b})")
          elif vt(vj_v) < vt(py):
              print(f"NOTICE: version.json held back at {vj_v} (build {vj['build_number']}) while app is {py} — expected until the release is live")
          else:
              errs.append(f"version.json {vj_v} is AHEAD of pyproject {py} — the feed advertises a version that does not exist")

          if errs:
              print("Version drift:", file=sys.stderr)
              for e in errs:
                  print("  - " + e, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Tests
        run: uv run pytest -q -m "not live"

  prepare-release:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
      MAKE_LATEST: ${{ steps.tag_info.outputs.MAKE_LATEST }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Proot Distro ${{ github.ref_name }} (pre-release, pending approval)" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
          fi
      - name: Create Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.

            *Proot Distro: Linux on Android without root or Termux.*
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: ${{ steps.tag_info.outputs.MAKE_LATEST }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apk:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build native payload wheel set (flet-proot, pinned + sha256-verified)
        run: uv run python scripts/build_flet_proot_wheel.py --out wheels

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks

      - name: Sync Python deps
        run: uv sync --frozen --group dev

      - name: Build APK (split per ABI, legacy packaging)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          uv run flet build apk --yes -v \
            --build-version ${{ env.BUILD_VERSION }} \
            --build-number ${{ env.BUILD_NUMBER }}

      - name: Size report & prune check
        run: |
          ls -lh build/apk/*.apk
          for artifact in build/apk/*.apk; do
            echo "== $artifact prune check"
            if unzip -l "$artifact" | grep -qE 'pytest/|ruff/|uvicorn/|starlette/|fastapi/|docs/'; then
              echo "::error::development-only files found in $artifact"
              exit 1
            fi
          done

      - name: Verify 16 KB page alignment (Google Play requirement)
        run: uv run python scripts/check_elf_alignment.py build/apk/*.apk

      - name: Upload APKs to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk

  aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build native payload wheel set (flet-proot, pinned + sha256-verified)
        run: uv run python scripts/build_flet_proot_wheel.py --out wheels

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks

      - name: Sync Python deps
        run: uv sync --frozen --group dev

      - name: Build AAB (Play bundle)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          uv run flet build aab --yes -v \
            --build-version ${{ env.BUILD_VERSION }} \
            --build-number ${{ env.BUILD_NUMBER }}

      - name: Inspect the merged manifest (SDK levels + permissions)
        run: |
          set -euo pipefail
          # The appbundle flow writes the app's merged manifest at a different
          # path than the apk flow, and every Android plugin also emits one, so
          # pick the app's own merged/packaged manifest explicitly.
          app_intermediates=$(find build/flutter/build/app/intermediates -type f             -name "AndroidManifest.xml" 2>/dev/null | grep -m1 -E 'packaged_manifests|merged_manifests' || true)
          if [ -n "$app_intermediates" ]; then
            manifest=$app_intermediates
          else
            manifest=build/flutter/android/app/src/main/AndroidManifest.xml
            echo "::warning::using the app's source manifest (no merged manifest found)"
          fi
          echo "manifest: $manifest"
          admob=$(grep -o 'com.google.android.gms.ads.APPLICATION_ID' "$manifest" | head -1 || true)
          echo "AdMob APPLICATION_ID declared: ${admob:-NO}"
          target=$(grep -o 'android:targetSdkVersion="[0-9]*"' "$manifest" | grep -o '[0-9]*' | head -1 || true)
          min=$(grep -o 'android:minSdkVersion="[0-9]*"' "$manifest" | grep -o '[0-9]*' | head -1 || true)
          echo "targetSdkVersion=${target:-unknown} minSdkVersion=${min:-unknown}"
          # Play requires API 36+ for new submissions (play-policy.md 2.1).
          if [ -z "${target:-}" ] || [ "$target" -lt 36 ]; then
            echo "::error::targetSdkVersion ${target:-unknown} < 36 (Play requires 36 for new apps)"
            exit 1
          fi

          # Ours + the ones google_mobile_ads contributes (ACCESS_ADSERVICES_AD_ID
          # is the SDK's advertising-id permission; the data-safety form declares
          # it). Anything else — any install-related permission — fails the build.
          perms=$(grep -o 'android:name="android.permission.[A-Z_0-9]*"' "$manifest" | sed 's/android:name="//;s/"//' | sort -u || true)
          echo "Permissions found:"
          echo "$perms"
          for allowed in "android.permission.INTERNET" "android.permission.ACCESS_NETWORK_STATE"; do
            case "$perms" in
              *"$allowed"*) ;;
              *) echo "::error::$allowed missing from the manifest"; exit 1;;
            esac
          done
          # The ads SDK contributes the ACCESS_ADSERVICES_* advertising-id and
          # attribution permissions (AD_ID / ATTRIBUTION, play-services); the
          # data-safety form declares them. The build template's baseline carries
          # FOREGROUND_SERVICE (no FGS type, no service — O-5 stays NO) and
          # WAKE_LOCK (flet's boot_screen keep-screen-on shim; nothing in the
          # app acquires a wakelock itself). Anything else, and above all any
          # install permission, fails the build.
          for perm in $perms; do
            case "$perm" in
              "android.permission.INTERNET"|"android.permission.ACCESS_NETWORK_STATE"|android.permission.ACCESS_ADSERVICES_*|"android.permission.FOREGROUND_SERVICE"|"android.permission.WAKE_LOCK") ;;
              *) echo "::error::unexpected permission $perm (A-12: no install permissions)"; exit 1;;
            esac
          done
          if [ -z "$admob" ]; then
            echo "::error::com.google.android.gms.ads.APPLICATION_ID missing — flet-ads needs it or the app dies at launch"
            exit 1
          fi
          if grep -q "REQUEST_INSTALL_PACKAGES" "$manifest"; then
            echo "::error::REQUEST_INSTALL_PACKAGES present"
            exit 1
          fi
          echo "manifest OK"

      - name: Verify no development files in the bundle
        run: |
          set -euo pipefail
          for artifact in build/aab/*.aab; do
            echo "== $artifact"
            unzip -q -o "$artifact" "base/assets/app/app.zip" -d /tmp/aab_check || true
            if [ -f /tmp/aab_check/base/assets/app/app.zip ]; then
              if unzip -l /tmp/aab_check/base/assets/app/app.zip | grep -qE 'pytest/|ruff/|uvicorn/|starlette/|fastapi/|docs/'; then
                echo "::error::development-only files found in app.zip inside $artifact"
                exit 1
              fi
            fi
            rm -rf /tmp/aab_check
          done

      - name: Verify 16 KB page alignment (Google Play requirement)
        run: uv run python scripts/check_elf_alignment.py build/aab/*.aab

      - name: Write third-party sources bundle
        run: uv run python scripts/generate_third_party_sources.py

      - name: Upload AAB and Sources to Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: |
            build/aab/*.aab
            THIRD-PARTY-SOURCES.md


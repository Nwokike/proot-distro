name: App Build

on:
  push:
    paths:
      - "src/**"
      - "build_flet_proot_wheel.py"
      - "tests/**"
      - "LICENSES/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "0.1.0"
      build_number:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '0.1.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (project + dev group)
        run: uv sync --frozen --group dev
      - name: Ruff
        run: |
          uv run ruff check src tests build_flet_proot_wheel.py
          uv run ruff format --check src tests build_flet_proot_wheel.py
      - name: Flet API guard (AST, installed flet)
        run: |
          for f in $(find src -name "*.py"); do
            uv run --no-sync python tests/check_flet_api.py "$f" || exit 1
          done
      - name: Tests
        run: uv run pytest -q -m "not live"

  apk:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build native payload wheel set (flet-proot, pinned + sha256-verified)
        run: python3 build_flet_proot_wheel.py --out wheels

      # House signing convention (D-008): KEYSTORE_BASE64 -> keystore file,
      # passwords only via FLET_ANDROID_SIGNING_* env.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks

      - name: Sync Python deps
        run: uv sync --frozen --group dev

      - name: Build APK (split per ABI, legacy packaging)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          uv run flet build apk --yes -v \
            --build-version ${{ env.BUILD_VERSION }} \
            --build-number ${{ env.BUILD_NUMBER }}

      # Payload presence + 16K alignment are enforced at wheel-build time by
      # build_flet_proot_wheel.py (sha256-verified pins, PT_LOAD >= 0x4000),
      # so the APK can only ever contain the aligned payload.

      # Delivery is the prerelease below, NOT actions/upload-artifact — this
      # account's artifact quota is exhausted (D-006).
      - name: Publish app prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: app-${{ github.run_number }}
          name: "App build #${{ github.run_number }}"
          body: |
            Development APK — install on a phone to verify the app end-to-end.

            commit `${{ github.sha }}`
          prerelease: true
          make_latest: false
          files: build/apk/*.apk